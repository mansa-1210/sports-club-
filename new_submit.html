<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Member</title>
</head>
<body>
    <h1>Add New Member</h1>
    <form action="add_member.php" method="POST">
        <label for="m_id">Member ID:</label><br>
        <input type="text" id="m_id" name="m_id" required><br><br>
        
        <label for="u_name">Username:</label><br>
        <input type="text" id="u_name" name="u_name" required><br><br>
        
        <label for="gender">Gender:</label><br>
        <input type="text" id="gender" name="gender" required><br><br>
        
        <label for="mobile">Mobile:</label><br>
        <input type="text" id="mobile" name="mobile" required><br><br>
        
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>
        
        <label for="jdate">Joining Date:</label><br>
        <input type="date" id="jdate" name="jdate" required><br><br>
        
        <label for="plan">Plan:</label><br>
        <select id="plan" name="plan" required>
            <option value="FOQKJF">Football Plan</option>
            <option value="COQKJC">Cricket Plan</option>
            <option value="BOQKJB">Badminton Plan</option>
        </select><br><br>
        
        <label for="street_name">Street Name:</label><br>
        <input type="text" id="street_name" name="street_name" required><br><br>
        
        <label for="city">City:</label><br>
        <input type="text" id="city" name="city" required><br><br>
        
        <label for="zipcode">Zipcode:</label><br>
        <input type="text" id="zipcode" name="zipcode" required><br><br>
        
        <label for="state">State:</label><br>
        <input type="text" id="state" name="state" required><br><br>
        
        <input type="submit" value="Add Member">
    </form>
</body>
</html>
